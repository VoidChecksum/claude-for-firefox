<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — Claude</title>
  <style>
    :root {
      --bg: #f9f5ef;
      --fg: #1a1a1a;
      --accent: #d97706;
      --success: #16a34a;
      --error: #dc2626;
      --muted: #6b7280;
      --card: #ffffff;
      --border: #e5e1db;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1715;
        --fg: #e5e1db;
        --card: #262220;
        --border: #3d3835;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .success h1 { color: var(--success); }
    .error h1 { color: var(--error); }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { transition: opacity 0.2s; }
  </style>
</head>
<body>
  <div class="card" id="status">
    <div class="spinner"></div>
    <h1>Completing authentication…</h1>
    <p>Please wait while your session is verified.</p>
  </div>
  <script>
    (function () {
      'use strict';

      var statusEl = document.getElementById('status');

      function showSuccess() {
        statusEl.className = 'card success';
        statusEl.innerHTML =
          '<div class="icon">&#10003;</div>' +
          '<h1>Authentication successful</h1>' +
          '<p>You can close this tab and return to the extension.</p>';
      }

      function showError(msg) {
        statusEl.className = 'card error';
        statusEl.innerHTML =
          '<div class="icon">&#10007;</div>' +
          '<h1>Authentication failed</h1>' +
          '<p>' + (msg || 'An unknown error occurred.') + '</p>';
      }

      try {
        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var state = params.get('state');
        var error = params.get('error');
        var errorDesc = params.get('error_description');

        if (error) {
          showError(errorDesc || error);
          return;
        }

        if (!code) {
          showError('No authorization code received.');
          return;
        }

        var message = {
          type: 'EXTERNAL_oauth_redirect',
          code: code,
          state: state || '',
        };

        if (typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.sendMessage) {
          chrome.runtime.sendMessage(message, function (response) {
            var lastErr = chrome.runtime.lastError;
            if (lastErr) {
              showError('Could not reach extension: ' + lastErr.message);
            } else if (response && response.success) {
              showSuccess();
            } else {
              showError((response && response.error) || 'Unexpected response from extension.');
            }
          });
        } else {
          showError('Extension API not available. Please re-open this page from the extension.');
        }
      } catch (e) {
        showError('Unexpected error: ' + e.message);
      }
    })();
  </script>
</body>
</html>
